# .github/workflows/validate-csv.yml
name: Validate CSV Data

on:
  pull_request:
    branches: [ main ] # Triggered on pull requests targeting the main branch

permissions:
  contents: read

jobs:
  validate:
    name: Validate CSV Files
    runs-on: ubuntu-latest # Specifies the execution environment

    steps:
      - name: Checkout code
        uses: actions/checkout@v7 # Checks out the repository code

      - name: Set up Node.js
        uses: actions/setup-node@v7 # Sets up the Node.js environment
        with:
          node-version-file: '.nvmrc' # Uses the project Node.js version
          cache: 'npm' # Enables npm dependency caching

      - name: Install dependencies
        run: npm ci # Installs dependencies based on package-lock.json

      - name: Verify npm registry signatures
        run: npm audit signatures

      - name: Extract baseline database from base branch
        # Use the released database on the base branch, since the PR may also update db/sqlite/catalog_data.db
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:db/sqlite/catalog_data.db" > "$RUNNER_TEMP/baseline_catalog_data.db"

      - name: Run database validation script
        run: npm run test-database -- --baseline "$RUNNER_TEMP/baseline_catalog_data.db" # Executes the CSV validation script

      - name: Run unit tests
        run: npm test # Executes the Jest test suites
